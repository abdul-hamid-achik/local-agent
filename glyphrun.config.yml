version: 1

artifactRoot: .glyphrun/runs
snapshotRoot: .glyphrun/snapshots

# Preserve every artifact from one full task glyphrun batch so a late failure
# cannot prune the diagnostics for an earlier scenario in the same run.
retention:
  keepRuns: 20

terminal:
  cols: 120
  rows: 36
  profile: xterm-256color
  normalize:
    trimRight: true
    normalizeLineEndings: true
    replace:
      - regex: "/(?:private/)?tmp/local-agent-glyphrun"
        with: "<temp>/local-agent-glyphrun"
      # Host workspace path in the session top bar differs between developer
      # machines and CI (and may be width-truncated mid-segment with …). Match
      # the project root plus common truncations — not longer paths under it.
      - regex: "/Users/[^/\\s]+/projects/local-agent"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/local-agent"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/local-agen…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/local-ag…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/local-a…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/local…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/loca…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/loc…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/lo…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects/l…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/projects…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/project…"
        with: "<project>"
      - regex: "/Users/[^/\\s]+/p╭"
        with: "<project>╭"
      - regex: "/Users/[^/\\s]+/p "
        with: "<project> "
      - regex: "/home/[^/\\s]+/work/local-agent/local-age…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/local-ag…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/local-a…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/local…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/loca…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/loc…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/lo…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/l…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agen…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-ag…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/loca…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/loc…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/lo…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/l…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/w…"
        with: "<project>"
      - regex: "/home/[^/\\s]+/work/local-agent/p╭"
        with: "<project>╭"
      - regex: "/home/[^/\\s]+/work/local-agent/p "
        with: "<project> "
      - regex: "~/projects/local-agent"
        with: "<project>"
      - regex: "~/work/local-agent/local-agent"
        with: "<project>"
      # Placeholder truncation marker placement can shift with cell metrics.
      - regex: "(Ask, @mention files, or type /help)…(\\s*)"
        with: "$1$2"
      - regex: "(Ask, @mention files, or type /help)(\\s+)…"
        with: "$1$2"
      # Session public IDs are random 7-char hex handles. Normalize them so
      # committed snapshots stay stable across runs while still covering the
      # handle shape in screen text.
      - regex: "\\b[0-9a-f]{7}\\b"
        with: "<session>"

artifacts:
  rawLog: true
  frames: true
  finalScreen: true
  snapshots: true
  agentContext: true
