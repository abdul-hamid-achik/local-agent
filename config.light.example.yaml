# Experimental profile for guided single-file work, not unattended coding.
# Prepare: ollama pull qwen3:1.7b
#          ollama create qwen3:1.7b-light -f Modelfile.light
# Merge these settings into the workspace's local-agent.yaml and create
# .local-agent/light-agents as an empty directory for this isolated profile.
# Launch: LOCAL_AGENT_ALLOW_LARGE_MODELS=0 local-agent -model qwen3:1.7b-light
# In the TUI, /load the file, request one precise change, inspect the approval,
# and verify the result with your compiler/tests. A Done receipt only means
# the turn ended; it does not certify that the generated code is correct.
# Memory depends on context and other applications, not just weight size.
ollama:
  model: qwen3:1.7b-light
  base_url: http://127.0.0.1:11434
  num_ctx: 8192
  disable_reasoning: false
model:
  auto_select: false
agents:
  dir: .local-agent/light-agents
  auto_load: false
servers: []
ice:
  enabled: false
experts:
  enabled: false
privacy:
  local_only: true
tools:
  builtin_tools: [read, grep, edit, bash]
  max_iterations: 6
  auto_max_iterations: 6
  auto_max_segments: 1
  timeout: 20s
