name: Release

# A `v*` tag publishes the CLI: the gates run once more, each platform's
# runner compiles and checks its own archive, then the GitHub release
# carries the four archives, a source tarball of the tag and one checksum
# file, and the Homebrew cask moves to the new version. Historical Go
# releases keep their own tags and assets.

# A manual run is a rehearsal, from a branch or a tag alike: it builds and
# checks the four archives and publishes nothing (the version job runs only
# for a pushed tag, and every publishing job needs it).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # `--version` reads apps/cli/package.json: a tag that names another
  # version would ship a CLI that misreports itself. Only vX.Y.Z: a
  # pre-release tag would become the latest release the installer picks,
  # and the cask takes plain versions. Checked first, before the gates
  # spend their minutes.
  version:
    name: the tag names the CLI's version
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compare the tag with apps/cli/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $TAG is not vX.Y.Z"
            exit 1
          fi
          version="$(jq -r .version apps/cli/package.json)"
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::tag $TAG does not match apps/cli/package.json version ${version}"
            exit 1
          fi

  verify:
    needs: version
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  # One archive per platform, compiled on that platform (the Vue client
  # loads a native library, so no cross-compiling), then checked the way a
  # user meets it: unpacked outside the checkout, run with no Bun. The
  # Tuimark specs drive the compiled executable, and with no TUIMARK_BINARY
  # its SDK downloads and checks the pinned host as a user's first run does.
  binaries:
    name: archive (${{ matrix.target }})
    needs: version
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: darwin_arm64
          - os: macos-15-intel
            target: darwin_amd64
          - os: ubuntu-24.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Compile and pack
        run: bun scripts/release-binary.ts --out dist/release

      - name: Check the archive (version, ui/, a hostile workspace)
        run: bun scripts/release-smoke.ts dist/release/local-agent_*_${{ matrix.target }}.tar.gz

      - name: The executable carries a valid signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose dist/release/local-agent_*_${{ matrix.target }}/local-agent

      - name: Set up Go for Glyphrun
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: false
      - run: go install github.com/abdul-hamid-achik/glyphrun/cmd/glyph@v0.24.1

      - name: Tuimark specs against the compiled executable
        run: |
          LOCAL_AGENT_BIN="$(echo "$PWD"/dist/release/local-agent_*_${{ matrix.target }}/local-agent)"
          export LOCAL_AGENT_BIN
          glyph run \
            specs/tuimark/tuimark_startup.yml \
            specs/tuimark/tuimark_chat.yml \
            specs/tuimark/tuimark_edit_approved.yml \
            specs/tuimark/tuimark_inline_chat.yml \
            specs/tuimark/tuimark_old_binary_fallback.yml \
            --parallel 1 --format md --progress never

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: dist/release/local-agent_*_${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: archives, source tarball and notes
    needs: [version, verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: assets

      - name: Pack the source tree and sum every asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="local-agent-${TAG}-src/" -o "assets/local-agent-${TAG}-src.tar.gz" "$TAG"
          cd assets
          set -- local-agent_*.tar.gz
          test "$#" -eq 4
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat <<'NOTES'
          ## Install

          ```sh
          curl -fsSL https://local-agent.dev/install.sh | sh
          # or
          brew install --cask abdul-hamid-achik/tap/local-agent
          ```

          Needs a running [Ollama](https://ollama.com). Archives for macOS and
          Linux (arm64 and x86-64) hold the `local-agent` executable and its `ui/`
          folder; checksums are in `SHA256SUMS.txt`. The source tarball builds
          with Bun 1.4.2 (`bun install --frozen-lockfile && bun run dev`).

          ## Changes

          NOTES
            git log --no-merges --format='- %s' "$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "${TAG}^")..${TAG}"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Re-runnable: a run that failed after creating the release uploads
      # the assets again over whatever it left.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" --clobber assets/*.tar.gz assets/SHA256SUMS.txt

  # The cask in abdul-hamid-achik/homebrew-tap installs the new archives.
  # Its sums come from the published SHA256SUMS.txt, so the cask names the
  # bytes the release serves.
  cask:
    name: Homebrew cask
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Write the cask from the release's checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          bun scripts/release-cask.ts "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" > "$RUNNER_TEMP/local-agent.rb"
          cat "$RUNNER_TEMP/local-agent.rb"

      # checkout keeps the token in an auth header of the clone's config, not
      # in a URL or a command line.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: abdul-hamid-achik/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push it to the tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp "$RUNNER_TEMP/local-agent.rb" tap/Casks/local-agent.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/local-agent.rb
          git diff --cached --quiet && exit 0
          git commit -m "local-agent ${TAG#v}"
          git push origin HEAD
