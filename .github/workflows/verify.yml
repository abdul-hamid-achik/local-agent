name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bun:
    name: Bun monorepo verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Set up Go for Glyphrun and the Tuimark binary
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install the tuimark binary that matches the vendored SDK
        working-directory: apps/cli
        run: |
          version="$(bun -e 'console.log(require("@thelacanians/tuimark/package.json").version)')"
          # A pre-release tarball (0.4.6-pre) is built from the tag it precedes.
          version="${version%%-*}"
          GOBIN="$RUNNER_TEMP/tuimark" go install "github.com/abdul-hamid-achik/tuimark/cmd/tuimark@v${version}"
          echo "TUIMARK_BINARY=$RUNNER_TEMP/tuimark/tuimark" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/tuimark/tuimark" version
      # TUIMARK_BINARY is set by now: with CI set, the Tuimark loop in `check` fails
      # (it does not skip) when the binary is missing.
      - run: bun run check
      - name: Install Glyphrun for Bun terminal contracts
        run: go install github.com/abdul-hamid-achik/glyphrun/cmd/glyph@v0.23.0
      - name: Verify Bun terminal contract hashes
        run: |
          for spec in specs/bun/*.yml specs/tuimark/*.yml; do
            glyph spec verify "$spec" --format md || exit 1
          done
      - run: bun run test:integration
      - run: bun run test:integration:tuimark

  site:
    name: VitePress site verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit site dependencies
        run: bun audit --audit-level=moderate

      - name: Build site
        run: bun run site:build

      - name: Test rendered internal links
        run: bun run site:check-links
