            - paragraph [ref=e333]:
              - generic [ref=e334]: Cyberpunk 2077
              - text: is an open-world, action-adventure role-playing video game, developed and published by
              - link "CD Projekt RED" [ref=e335] [cursor=pointer]:
                - /url: /wiki/CD_Projekt_RED
              - text: that was released December 10, 2020. The game was
              - link "announced" [ref=e336] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2077_Reveal
              - text: during the
              - link "2012 CD Projekt Red Summer Conference" [ref=e337] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=KK5qvys_Jz4
              - text: as the official video game adaption of
              - link "Mike Pondsmith" [ref=e338] [cursor=pointer]:
                - /url: /wiki/Mike_Pondsmith
              - text: "'s pen and paper RPG"
              - link "Cyberpunk 2020" [ref=e340] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2020
              - text: . An expansion for the videogame, called
              - link "Phantom Liberty" [ref=e342] [cursor=pointer]:
                - /url: /wiki/Phantom_Liberty
              - text: ", was released on September 26, 2023. An \"Ultimate Edition\", including the base game and its expansion released on December 5, 2023 alongside"
              - link "Patch 2.1" [ref=e343] [cursor=pointer]:
                - /url: /wiki/Patch_2.1
              - text: .
