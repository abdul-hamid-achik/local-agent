            - paragraph [ref=e462]:
              - text: Cyberpunk 2077 is a continuation of the events of
              - link "Cyberpunk 2020" [ref=e464] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2020
              - text: ", taking an alternate path to that of"
              - link "Cyberpunk V3.0" [ref=e465] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_V3.0
              - text: . The game is set in the dystopian metropolis of
              - link "Night City" [ref=e466] [cursor=pointer]:
                - /url: /wiki/Night_City
              - text: ", located in the"
              - link "Free State of Northern California" [ref=e467] [cursor=pointer]:
                - /url: /wiki/North_California
              - text: . Night City is located south of San Francisco around the area of Morro Bay, CA. During
              - link "Cyberpunk 2020" [ref=e469] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2020
              - text: ","
              - link "Night City" [ref=e470] [cursor=pointer]:
                - /url: /wiki/Night_City
              - text: is said to have a population of more than five million inhabitants. However, this number is suspected to be considerably larger in 2077.
            - paragraph [ref=e471]:
              - text: Following an economic collapse sometime during the early 21st century, the
              - link "United States" [ref=e472] [cursor=pointer]:
                - /url: /wiki/United_States_of_America
              - text: is forced to rely on large corporations to survive. These corporations deal in a wide range of areas, such as
              - link "weapons" [ref=e473] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2077_Weapons
              - text: ","
              - link "robotics" [ref=e474] [cursor=pointer]:
                - /url: /wiki/Robotics
              - text: ","
              - link "cybernetics" [ref=e475] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2077_Cyberware
              - text: ", pharmaceuticals, communications, and biotechnology; many of these companies operate above the law."
            - paragraph [ref=e476]:
              - text: The game follows the story of
              - link "V" [ref=e477] [cursor=pointer]:
                - /url: /wiki/V
              - text: — a hired gun on the rise in
              - link "Night City" [ref=e478] [cursor=pointer]:
                - /url: /wiki/Night_City
              - text: ", the most violent and dangerous metropolis of the"
              - link "corporate" [ref=e479] [cursor=pointer]:
                - /url: /wiki/Corporations
              - text: "-ruled future. A robust"
              - link "character creator" [ref=e480] [cursor=pointer]:
                - /url: /wiki/Character_Creation
              - text: will allow players to choose V's gender, visual appearance, as well as historical background — all of which may influence the shape of the game.
            - paragraph [ref=e481]:
              - text: The world is inspired by the works of authors such as
              - link "William Gibson" [ref=e482] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/William_Gibson
              - text: (author of
              - link "Neuromancer" [ref=e484] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Neuromancer
              - text: ) and
              - link "Philip K. Dick" [ref=e485] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Philip_K._Dick
              - text: ", whose novel"
              - link "Do Androids Dream of Electric Sheep?" [ref=e487] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Do_Androids_Dream_of_Electric_Sheep%3F
              - text: and subsequent movie adaptation
              - link "Blade Runner" [ref=e489] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Blade_Runner
              - text: heavily influenced the creator,
              - link "Mike Pondsmith" [ref=e490] [cursor=pointer]:
                - /url: /wiki/Mike_Pondsmith
              - text: ", in creating the original tabletop RPG."
            - heading [level=2] [ref=e492]:
              - text: Plot
              - link "Sign in to edit" [ref=e494] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D2&uselang=en&metadata=article-registration-edit-article-section
            - heading [level=3] [ref=e497]:
              - text: Prologue
              - link "Sign in to edit" [ref=e499] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D3&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e502]:
              - text: The player character V, is contracted along with
              - link "Jackie Welles" [ref=e503] [cursor=pointer]:
                - /url: /wiki/Jackie_Welles
              - text: ", to steal an important piece of technology from the"
              - link "Arasaka Corporation" [ref=e504] [cursor=pointer]:
                - /url: /wiki/Arasaka_Corporation
              - text: "- known as the chip of immortality - by fixer"
              - link "Dexter Deshawn" [ref=e505] [cursor=pointer]:
                - /url: /wiki/Dexter_Deshawn
              - text: . The duo manage to infiltrate the megacorp and steal the device but the plan goes horribly wrong resulting in Jackie getting killed. After meeting with Dexter, V is betrayed and left for dead in a landfill, but manages to survive - possibly in-part due to the chip of immortality - and is haunted by the digital-ghost of iconic
              - link "Rockerboy" [ref=e506] [cursor=pointer]:
                - /url: /wiki/Rockerboy
              - text: ","
              - link "Johnny Silverhand" [ref=e507] [cursor=pointer]:
                - /url: /wiki/Johnny_Silverhand
              - text: .
            - heading [level=4] [ref=e508]:
              - text: The Corpo-Rat
              - link "Sign in to edit" [ref=e510] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D4&uselang=en&metadata=article-registration-edit-article-section
            - definition [ref=e514]:
              - generic [ref=e515]:
                - text: "Main article:"
                - link "The Corpo-Rat" [ref=e516] [cursor=pointer]:
                  - /url: /wiki/The_Corpo-Rat
            - paragraph [ref=e517]:
              - text: V starts in the
              - link "Arasaka Tower" [ref=e518] [cursor=pointer]:
                - /url: /wiki/Arasaka_Tower
              - text: ", where"
              - link "Arthur Jenkins" [ref=e519] [cursor=pointer]:
                - /url: /wiki/Arthur_Jenkins
              - text: gives them a job to take out another corporate employee. V arrives at
              - link "Lizzie's Bar" [ref=e520] [cursor=pointer]:
                - /url: /wiki/Lizzie%27s_Bar
              - text: by AV and is accosted by several basketball players, whom they almost crushed by conducting an illegal landing on the basketball court. V enters the establishment and meets up with their old friend Jackie Welles, and the two begin to discuss.
            - paragraph [ref=e521]:
              - text: Unfortunately for them both, their target has caught wind of the attempt and Arasaka personnel arrive. V's contract is terminated in full and they are nearly dragged away by the Arasaka goons, only for Jackie to step in and intimidate the Arasaka personnel into backing down. V has lost almost everything at this point - except for the 10,000
              - link "eurodollars" [ref=e522] [cursor=pointer]:
                - /url: /wiki/Eurodollar
              - text: Jenkins gave them.
            - heading [level=4] [ref=e523]:
              - text: The Nomad
              - link "Sign in to edit" [ref=e525] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D5&uselang=en&metadata=article-registration-edit-article-section
            - definition [ref=e529]:
              - generic [ref=e530]:
                - text: "Main article:"
                - link "The Nomad" [ref=e531] [cursor=pointer]:
                  - /url: /wiki/The_Nomad
            - paragraph [ref=e532]:
              - text: V, a lone nomad on their way to
              - link "Night City" [ref=e533] [cursor=pointer]:
                - /url: /wiki/Night_City
              - text: ", has car issues on the border to the badlands and is forced to seek the services of a local mechanic. V managed to fix the vehicle before they are confronted by the local"
              - link "sheriff" [ref=e534] [cursor=pointer]:
                - /url: /wiki/Andrew_Jones
              - text: as they continue on towards Night City. V then has to head to a nearby radio mast to get in touch with someone from their clan in order to meet up with Jackie Welles on the outskirts and collect an Arasaka-owned cryo-storage container which must then be smuggled through the border checkpoint. Border security tips off Arasaka, however, and agents attempt to intercept V and Jackie before they can enter the city; a car chase ensues where V must use a
              - link "DR5 Nova" [ref=e535] [cursor=pointer]:
                - /url: /wiki/DR5_Nova
              - text: to take care of the pursuers.
            - paragraph [ref=e536]: After shaking the Arasaka pursuit, Jackie and V take a moment to inspect the cargo; it turns out to be an iguana of a species from the Lesser Antilles, one thought to be completely extinct.
            - heading [level=4] [ref=e538]:
              - text: The Streetkid
              - link "Sign in to edit" [ref=e540] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D6&uselang=en&metadata=article-registration-edit-article-section
            - definition [ref=e544]:
              - generic [ref=e545]:
                - text: "Main article:"
                - link "The Streetkid" [ref=e546] [cursor=pointer]:
                  - /url: /wiki/The_Streetkid
            - paragraph [ref=e547]:
              - text: V is running a job for
              - link "Kirk Sawyer" [ref=e548] [cursor=pointer]:
                - /url: /wiki/Kirk_Sawyer
              - text: ", who provides them with the technology to steal a high-end"
              - link "Rayfield Aerondight \"Guinevere\"" [ref=e549] [cursor=pointer]:
                - /url: /wiki/Rayfield_Aerondight_%22Guinevere%22
              - text: owned by
              - link "Kaoru Fujioka" [ref=e550] [cursor=pointer]:
                - /url: /wiki/Kaoru_Fujioka
              - text: . V enters the car before they are stopped and held at gunpoint by Jackie Welles, who also intends to steal the car for his own purposes. Before he is successful, an
              - link "NCPD" [ref=e551] [cursor=pointer]:
                - /url: /wiki/NCPD
              - text: squad show up, and busts the pair. The squad is led by Jackie's childhood acquaintance,
              - link "Inspector Stints" [ref=e552] [cursor=pointer]:
                - /url: /wiki/Henry_Stints
              - text: ", who also recognizes V. Kaoru—the"
              - link "Arasaka" [ref=e553] [cursor=pointer]:
                - /url: /wiki/Arasaka
              - text: employee—shows up and orders Stints to kill the pair and dump their bodies out at sea, as he does not wish to see them go to trial. Jackie and V are beaten up by the police, but are ultimately spared, and the two decide to join forces.
            - heading [level=2] [ref=e554]:
              - text: Gameplay
              - link "Sign in to edit" [ref=e556] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D7&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e559]:
              - text: Cyberpunk is an open world, non-linear RPG with an FPS style in which players are able to customize their
              - link "character" [ref=e560] [cursor=pointer]:
                - /url: /wiki/V_(character)
              - text: to suit their play style. Quests and objectives can be completed in a variety of different ways. One such example of gameplay is non-English speaking characters featured throughout
              - link "Night City" [ref=e561] [cursor=pointer]:
                - /url: /wiki/Night_City
              - text: .
            - paragraph [ref=e562]:
              - text: The game was originally stated to be a single player experience with multiplayer elements. It was reported in early 2018 that the multiplayer components may have been scrapped,
              - superscript [ref=e563]:
                - link "Reference 1" [ref=e564] [cursor=pointer]:
                  - /url: "#cite_note-1"
                  - text: "[1]"
              - text: however in June 2018 CD Projekt stated that they had multiplayer "in R&D" but it would not be included for the game's launch.
            - paragraph [ref=e565]: The world has dynamic weather and a day/night cycle.
            - heading [level=3] [ref=e566]:
              - text: Perspective
              - link "Sign in to edit" [ref=e568] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D8&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e571]:
              - text: The game is played primarily from a first-person perspective. A new combat system has been developed around this perspective that includes the use of guns, melee weapons, implants, and even combat stimulants that grant additional bonuses, such as increasing speed. Players may choose a third-person perspective whilst driving
              - link "vehicles" [ref=e572] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2077_Vehicles
              - text: .
            - heading [level=3] [ref=e573]:
              - text: Attributes
              - link "Sign in to edit" [ref=e575] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D9&uselang=en&metadata=article-registration-edit-article-section
            - definition [ref=e579]:
              - generic [ref=e580]:
                - text: "Main article:"
                - link "Cyberpunk 2077 Attributes" [ref=e581] [cursor=pointer]:
                  - /url: /wiki/Cyberpunk_2077_Attributes
            - paragraph [ref=e582]:
              - text: Player characters have
              - link "attributes" [ref=e583] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2077_Attributes
              - text: which can be raised via leveling and installing
              - link "cyberware" [ref=e584] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2077_Cyberware
              - text: . Skills and perks can also be selected; skills are related to performing actions - such as
              - link "hacking" [ref=e585] [cursor=pointer]:
                - /url: /wiki/Quickhacking
              - text: ", crafting, specific"
              - link "weapons" [ref=e586] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_2077_Weapons
              - text: ", etc. - while perks can be unlocked with both"
              - link "Street Credit" [ref=e587] [cursor=pointer]:
                - /url: /wiki/Street_Cred
              - text: "and Experience point's. There are five key attributes:"
              - link "Body" [ref=e588] [cursor=pointer]:
                - /url: /wiki/Body
              - text: ","
              - link "Cool" [ref=e589] [cursor=pointer]:
                - /url: /wiki/Cool
              - text: ","
              - link "Intelligence" [ref=e590] [cursor=pointer]:
                - /url: /wiki/Intelligence
              - text: ","
              - link "Reflexes" [ref=e591] [cursor=pointer]:
                - /url: /wiki/Reflexes
              - text: ", and"
              - link "Technical Ability" [ref=e592] [cursor=pointer]:
                - /url: /wiki/Technical_Ability
              - text: .
            - paragraph [ref=e593]:
              - text: During
              - link "character creation" [ref=e594] [cursor=pointer]:
                - /url: /wiki/Character_Creation
              - text: ", the player can select a gender and customize their character; customization can include depictions of breasts, buttocks, and genitalia, as well as various sizes and combinations of genitals. Options also include picking between a male or female sounding voice, while also adjusting the pitch."
              - superscript [ref=e595]:
                - link "Reference 2" [ref=e596] [cursor=pointer]:
                  - /url: "#cite_note-2"
                  - text: "[2]"
              - text: Other tabs that have further customization options include Birth Record, Biometric Scan (face, hair, scars, coloration), Appearance (style, clothes, makeup, piercings, tattoos, mods), and Biostats.
            - paragraph [ref=e597]:
              - text: One can also choose from a set of background stories (
              - link "Nomad" [ref=e598] [cursor=pointer]:
                - /url: /wiki/Nomad
              - text: ","
              - link "Streetkid" [ref=e599] [cursor=pointer]:
                - /url: /wiki/Streetkid_(Lifepath)
              - text: ", or"
              - link "Corporate" [ref=e600] [cursor=pointer]:
                - /url: /wiki/Corporate
              - text: ) and other elements to fully flesh out their characters (like childhood hero, key life events, and what drove them to
              - link "Night City" [ref=e601] [cursor=pointer]:
                - /url: /wiki/Night_City
              - text: ).
            - heading [level=3] [ref=e603]:
              - text: Exploration
              - link "Sign in to edit" [ref=e605] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D10&uselang=en&metadata=article-registration-edit-article-section
            - heading [level=4] [ref=e608]:
              - text: Dialogue options
              - link "Sign in to edit" [ref=e610] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D11&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e613]: Cycle through dialogue options to select one. Gold dialogue options represent important choices that progress the conversation. Blue dialogue options represent choices that might reveal valuable information or lead to interesting interactions. Some of them tie into your life path. Some dialogue options will appear grayed out, meaning you do not meet the Attribute requirement necessary to make that choice.
            - paragraph [ref=e614]: Some dialogue points are time sensitive, as indicated by a status bar which depletes over time appearing above the available options. During this time, V much choose a dialogue option before the bar runs out, or the conversation will acknowledge V's lack of answer as a response itself.
            - paragraph [ref=e615]: Due to the gameplay mechanics, there no way to exit conversations other than V physically walking away; this will often prompt an annoyed or dismayed response from the character V was speaking with, but typically does not result in any negative consequences, and the conversation will continue or restart once V is back within speaking range. Characters will also acknowledge if V does not respond to their dialogue for an extended time, though, unlike the aforementioned time-sensitive dialogue points, this will not affect the conversation.
            - heading [level=4] [ref=e616]:
              - text: Scanning
              - link "Sign in to edit" [ref=e618] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D12&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e621]: Quick scan or enter scanning mode, which highlights objects of interest around you and can provide useful information about them.
            - list [ref=e622]:
              - listitem [ref=e623]: "Enemies: Red"
              - listitem [ref=e624]: "Interactive objects: Blue"
              - listitem [ref=e625]: "Job-related objects: Gold"
              - listitem [ref=e626]: "Hackable objects: Green"
              - listitem [ref=e627]: "Loot: icon"
            - heading [level=4] [ref=e628]:
              - text: Vehicles
              - link "Sign in to edit" [ref=e630] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D13&uselang=en&metadata=article-registration-edit-article-section
            - definition [ref=e634]:
              - generic [ref=e635]:
                - text: "Main article:"
                - link "Cyberpunk 2077 Vehicles" [ref=e636] [cursor=pointer]:
                  - /url: /wiki/Cyberpunk_2077_Vehicles
            - paragraph [ref=e637]: "Interactions include: enter vehicle, exit vehicle, accelerate, brake, steer, handbrake, headlights, horn, and switch camera. Call for your active vehicle and it will automatically park in the nearest available slot, provided you have access to the street."
            - heading [level=4] [ref=e639]:
              - text: Fast travel
              - link "Sign in to edit" [ref=e641] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D14&uselang=en&metadata=article-registration-edit-article-section
            - definition [ref=e645]:
              - generic [ref=e646]:
                - text: "Main article:"
                - link "Cyberpunk 2077 Fast Travel Dataterms" [ref=e647] [cursor=pointer]:
                  - /url: /wiki/Cyberpunk_2077_Fast_Travel_Dataterms
            - paragraph [ref=e648]: As you explore Night City, you will come across and unlock Fast Travel Dataterms. Interact with the nearest Dataterm to view a map with all currently unlocked locations. Select one to travel there.
            - heading [level=4] [ref=e649]:
              - text: Journal, phone, jobs
              - link "Sign in to edit" [ref=e651] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D15&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e654]: The Journal contains information about available, active, and completed Jobs as well as their specific objectives. To access the Journal, open in the main menu.
            - heading [level=4] [ref=e655]:
              - text: Movement
              - link "Sign in to edit" [ref=e657] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D16&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e660]: Move, look around, crouch, sprint, jump, slide, and vault. You automatically climb ledges that you jump to. To interact with a nearby object, look at it and select which action you want to perform. Advanced cyberware will unlock the double jump, charged jump, the ability to hover in the air for a short duration, and a devastating landing attack.
            - heading [level=2] [ref=e661]:
              - text: Development
              - link "Sign in to edit" [ref=e663] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D17&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e666]:
              - text: Originally titled just Cyberpunk, the 2077 subtitle was added in late 2012. During the beginning of production it was reported that a team of 50 people were working on it, however after the completion of the Witcher 3 and its subsequent expansion packs, the team has reportedly grown larger, with dozens of jobs being advertised on the CDPR website. In early 2018 it was reported that a new studio had been opened in Wrocław, Poland to assist in the development of the game.
              - superscript [ref=e667]:
                - link "Reference 3" [ref=e668] [cursor=pointer]:
                  - /url: "#cite_note-3"
                  - text: "[3]"
            - paragraph [ref=e669]: During an interview Paweł Sasko, lead quest designer for Cyberpunk 2077, said that the teams biggest inspiration for the story were Akira and Vampire The Masquerade Bloodlines, and almost every quest in the game tells some part of the world's story that you live in.
            - heading [level=2] [ref=e670]:
              - text: Marketing
              - link "Sign in to edit" [ref=e672] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D18&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=e675]:
              - text: In 2012
              - link "CD Projekt RED" [ref=e676] [cursor=pointer]:
                - /url: /wiki/CD_Projekt_RED
              - text: announced they had partnered with
              - link "Mike Pondsmith" [ref=e677] [cursor=pointer]:
                - /url: /wiki/Mike_Pondsmith
              - text: and acquired the licence for a video game set in the
              - link "Cyberpunk pen & paper world" [ref=e678] [cursor=pointer]:
                - /url: /wiki/Cyberpunk_series
              - text: . In early 2013 the title reveal and teaser trailer were shown to attract talent to start development of the game. The world premier was shown at
              - link "E3 2018" [ref=e679] [cursor=pointer]:
                - /url: /wiki/E3_2018
              - text: ", where viewers got a first glimpse at gameplay. The next year at"
              - link "E3 2019" [ref=e680] [cursor=pointer]:
                - /url: /wiki/E3_2019
              - text: ","
              - link "Keanu Reeves" [ref=e681] [cursor=pointer]:
                - /url: /wiki/Keanu_Reeves
              - text: was announced to play
              - link "Johnny Silverhand" [ref=e682] [cursor=pointer]:
                - /url: /wiki/Johnny_Silverhand
              - text: as well as showing off a cinematic trailer depicting the events of the prologue. CD Projekt Red later showed more gameplay at
              - link "Gamescom 2019" [ref=e683] [cursor=pointer]:
                - /url: /wiki/Gamescom_2019
              - text: as well as announcing a release date for April 2020. In January 2020 it was announced the game had been delayed to September, then November 2020. Due to the outbreak of Coronavirus, the 2020 conventions were cancelled and CDPR premiered
              - link "Night City Wire" [ref=e684] [cursor=pointer]:
                - /url: /wiki/Night_City_Wire
              - text: ", where new gameplay was shown as well as the announcements for the"
              - 'link "Cyberpunk: Edgerunners" [ref=e685] [cursor=pointer]':
