            - heading [level=2] [ref=e825]:
              - text: Trivia
              - link "Sign in to edit" [ref=e827] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fcyberpunk.fandom.com%2Fwiki%2FCyberpunk_2077%3Fveaction%3Dedit%26section%3D22&uselang=en&metadata=article-registration-edit-article-section
            - list [ref=e830]:
              - listitem [ref=e831]:
                - text: During an interview with CDPR developers, they mentioned their inspiration on how to develop the smaller and bigger stories that would be compelling, the team looked at the critically acclaimed anime film
                - link "Akira" [ref=e832] [cursor=pointer]:
                  - /url: https://akira.fandom.com/wiki/Akira_(anime)
                - text: and the renowned video game
                - 'link "Vampire: The Masquerade – Bloodlines" [ref=e833] [cursor=pointer]':
                  - /url: https://vtmb.fandom.com/wiki/Vampire:_The_Masquerade_-_Bloodlines
                - text: .
              - listitem [ref=e834]:
                - text: Hiroshi Sakakibara, Environment City Coordinator at CD Projekt Red, when asked about what was the main inspiration for Night City in Cyberpunk 2077 during the Tokyo Game Show 2020, Sakakibara mention how
                - link "Blade Runner" [ref=e835] [cursor=pointer]:
                  - /url: https://warnerbros.fandom.com/wiki/Blade_Runner
                - text: was one of more obvious inspirations. He also mentioned the team had also learned from Japanese anime and manga in the genre, such as Akira and the
                - link "Ghost in the Shell" [ref=e836] [cursor=pointer]:
                  - /url: https://ghostintheshell.fandom.com/wiki/Ghost_in_the_Shell_Wiki
                - text: series.
              - listitem [ref=e837]:
                - text: All the story and dialogue in the game was written in Polish, as the majority of CD Projekt studio employees are Poles, and then translated to English. The English version then became the basis for all the other dubs.
                - superscript [ref=e838]:
                  - link "Reference 10" [ref=e839] [cursor=pointer]:
                    - /url: "#cite_note-10"
                    - text: "[10]"
              - listitem [ref=e840]:
                - text: Cyberpunk 2077 had more than 8 million preorders.
                - superscript [ref=e841]:
                  - link "Reference 11" [ref=e842] [cursor=pointer]:
                    - /url: "#cite_note-11"
                    - text: "[11]"
              - listitem [ref=e843]:
                - text: As of December 2020, the game has sold 13 million copies.
                - superscript [ref=e844]:
                  - link "Reference 12" [ref=e845] [cursor=pointer]:
                    - /url: "#cite_note-12"
                    - text: "[12]"
              - listitem [ref=e846]:
                - text: As of September 2023, Cyberpunk 2077 has sold 25 million copies.
                - superscript [ref=e847]:
                  - link "Reference 13" [ref=e848] [cursor=pointer]:
                    - /url: "#cite_note-FactSheetSeptember-13"
                    - text: "[13]"
                - superscript [ref=e849]:
                  - link "Reference 14" [ref=e850] [cursor=pointer]:
                    - /url: "#cite_note-X1-14"
                    - text: "[14]"
              - listitem [ref=e851]:
                - text: As of November 26, 2024, Cyberpunk 2077 has sold 30 million copies.
                - superscript [ref=e852]:
                  - link "Reference 15" [ref=e853] [cursor=pointer]:
                    - /url: "#cite_note-X2-15"
                    - text: "[15]"
              - listitem [ref=e854]:
                - text: As of November 2025, Cyberpunk 2077 has sold 35 million copies.
                - superscript [ref=e855]:
                  - link "Reference 16" [ref=e856] [cursor=pointer]:
                    - /url: "#cite_note-16"
                    - text: "[16]"
              - listitem [ref=e857]:
                - text: As of July 3, 2026, Cyberpunk 2077 has sold 40 million copies.
                - superscript [ref=e858]:
                  - link "Reference 17" [ref=e859] [cursor=pointer]:
                    - /url: "#cite_note-X3-17"
                    - text: "[17]"
