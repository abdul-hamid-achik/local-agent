version: '3'

tasks:
  build:
    cmds: [bun run build]
  run:
    cmds: [bun run start {{.CLI_ARGS}}]
  dev:
    cmds: [bun run dev {{.CLI_ARGS}}]
  deps:
    cmds: [bun install --frozen-lockfile]
  lint:
    cmds: [bun run lint]
  test:
    cmds: [bun run test]
  verify:
    cmds:
      - bun install --frozen-lockfile
      - bun run check
      - bun run site:build
      - bun run site:check-links
  site:
    cmds: [bun run site]
  site:build:
    cmds: [bun run site:build]
  site:check-links:
    deps: ['site:build']
    cmds: [bun run site:check-links]
  site:preview:
    cmds: [bun run site:preview]
  test:integration:
    cmds: [bun run test:integration]
  glyphrun:
    cmds: [bun run test:integration]
  glyphrun-contracts:
    cmds:
      - for spec in specs/bun/*.yml; do glyph spec verify "$spec" --format md || exit 1; done
  tui:dev:
    cmds: [bun run tui:dev]
