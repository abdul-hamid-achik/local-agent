version: 1
name: bun_tuimark_edit_approved
intent: |
    the Tuimark client shows the proposed edit in an approval dialog with the
    cursor on Deny, and applies the exact edit in an isolated temporary
    workspace only after y (the dialog accepts y a moment after it opens,
    and stays readable after a resize).
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "edit-approve"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 32
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - type: "edit the notes"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - snapshot: approval
    - resize:
        cols: 70
        rows: 24
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 10000
    - snapshot: approval_narrow
    - wait:
        screen:
            contains: "y allow"
        timeoutMs: 10000
    - press: y
    - wait:
        screen:
            contains: "edit applied"
        timeoutMs: 15000
    - snapshot: applied
    - wait:
        screen:
            notContains: "Edit notes.txt?"
        timeoutMs: 10000
    # The turn has ended (the idle placeholder is back), so ctrl+c quits
    # instead of cancelling it.
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 10000
outcomes:
    - id: tuimark_edit_approved
      description: approving the proposal applies the exact edit in the workspace
      verify:
        process:
            exitCode: 0
contractHash: sha256:970a458b175510f337e33a94bf769da0395449dcbc685a3387aab9c5376a7f45
