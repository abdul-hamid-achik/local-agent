version: 1
name: bun_tuimark_edit_approved
intent: |
    the Tuimark client shows the proposed edit in an approval dialog with the
    cursor on Deny, and applies the exact edit in an isolated temporary
    workspace only after y.
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "edit-approve"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 32
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - type: "edit the notes"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - snapshot: approval
    - wait:
        screen:
            contains: "Waiting for approval"
        timeoutMs: 5000
    - press: y
    - wait:
        screen:
            contains: "edit applied"
        timeoutMs: 15000
    - snapshot: applied
    - wait:
        screen:
            notContains: "Edit notes.txt?"
        timeoutMs: 5000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: tuimark_edit_approved
      description: approving the proposal applies the exact edit in the workspace
      verify:
        process:
            exitCode: 0
contractHash: sha256:b1b4ebda276694ff695a162ecb1b96431564c086aa365dcc176099483d80c087
