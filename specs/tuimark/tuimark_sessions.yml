version: 1
name: bun_tuimark_sessions_switch
intent: |
    /sessions in the Tuimark client (--session-db): the picker lists the
    workspace's saved sessions, down and enter load the second saved one
    whole (its earlier turn appears, the header names it), and a new
    turn continues that session.
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "sessions"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 32
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 20000
    - type: "/sessions"
    - press: enter
    - wait:
        screen:
            contains: "Sessions"
        timeoutMs: 10000
    - wait:
        screen:
            contains: "messages · current"
        timeoutMs: 10000
    - snapshot: picker
    # Newest first (listSessions orders by updated_at): the fresh current
    # session, then the second saved one. A wrong row fails the wait below,
    # whose text only the second saved session holds.
    - press: down
    - press: enter
    - wait:
        screen:
            contains: "Resumed session"
        timeoutMs: 10000
    - wait:
        screen:
            contains: "stream the second reply"
        timeoutMs: 10000
    - wait:
        screen:
            contains: "stream complete"
        timeoutMs: 10000
    - snapshot: switched
    - type: "stream a third reply"
    - press: enter
    - wait:
        screen:
            contains: "stream a third reply"
        timeoutMs: 15000
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - snapshot: continued
    # The turn has ended (the idle placeholder is back), so ctrl+c quits
    # instead of cancelling it.
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 10000
outcomes:
    - id: tuimark_sessions_switch
      description: the picker switches the live conversation to a saved session and continues it
      verify:
        process:
            exitCode: 0
contractHash: sha256:a1d69242a484d58b75b1a1ffec373cdceae696b442330ecb7b33e9d4146ec017
