version: 1
name: bun_tuimark_history
intent: |
    in the Tuimark client, up on the first line of the composer recalls the
    messages sent before, newest first, down comes forward again, and down past
    the newest brings back the draft that was being written.
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "chat"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 32
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - press: up
    - wait:
        screen:
            matches: "║ Message the model\\s*║"
        timeoutMs: 3000
    - type: "count alpha"
    - press: enter
    - wait:
        screen:
            contains: "The message had 1 lines: count alpha"
        timeoutMs: 15000
    - wait:
        screen:
            contains: "Ready"
        timeoutMs: 15000
    - type: "count beta"
    - press: enter
    - wait:
        screen:
            contains: "The message had 1 lines: count beta"
        timeoutMs: 15000
    - wait:
        screen:
            contains: "Ready"
        timeoutMs: 15000
    - type: "half typed"
    - press: up
    - wait:
        screen:
            matches: "║ count beta\\s*║"
        timeoutMs: 5000
    - snapshot: newest
    - press: up
    - wait:
        screen:
            matches: "║ count alpha\\s*║"
        timeoutMs: 5000
    - snapshot: oldest
    - press: up
    - wait:
        screen:
            matches: "║ count alpha\\s*║"
        timeoutMs: 3000
    - press: down
    - wait:
        screen:
            matches: "║ count beta\\s*║"
        timeoutMs: 5000
    - press: down
    - wait:
        screen:
            matches: "║ half typed\\s*║"
        timeoutMs: 5000
    - snapshot: draft_back
    - press: ctrl+c
    - wait:
        screen:
            contains: "Draft cleared · ctrl+c again to quit"
        timeoutMs: 5000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: tuimark_history_recalls
      description: up walked back through both sent messages and down walked forward again to the unsent draft (proven by the step waits on the composer; the closing ctrl+c clears that draft, so the final screen shows the transcript instead)
      verify:
        screen:
            contains: "The message had 1 lines: count beta"
    - id: tuimark_history_exits
      description: the client exits cleanly
      verify:
        process:
            exitCode: 0
contractHash: sha256:13d645b8c382194d9fecdec3fe47cb1232d669ad8256e1f74c3ee00f46e0f575
