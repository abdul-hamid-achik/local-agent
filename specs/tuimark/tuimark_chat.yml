version: 1
name: bun_tuimark_chat
intent: |
    the opt-in Tuimark client (--ui tuimark) streams a markdown reply with a
    code block, answers slash commands locally, cancels a running reply with
    esc, and in the middle of a reply ctrl+c cancels it, then clears the prompt
    it gave back, then quits.
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "chat"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 32
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - snapshot: idle
    - type: "/mode plan"
    - press: enter
    - wait:
        screen:
            contains: "Mode changed to plan"
        timeoutMs: 10000
    - type: "/help"
    - press: enter
    - wait:
        screen:
            contains: "close help"
        timeoutMs: 10000
    - snapshot: help
    - press: esc
    - wait:
        screen:
            notContains: "close help"
        timeoutMs: 10000
    - type: "/nope"
    - press: enter
    - wait:
        screen:
            contains: "Unknown command: /nope"
        timeoutMs: 10000
    # The typo stays in the composer to be fixed; ctrl+c clears it.
    - wait:
        screen:
            contains: "║ /nope"
        timeoutMs: 10000
    - press: ctrl+c
    - wait:
        screen:
            notContains: "║ /nope"
        timeoutMs: 10000
    - type: "stream a reply"
    - press: enter
    - wait:
        screen:
            contains: "bounded retry"
        timeoutMs: 15000
    - snapshot: streaming
    - wait:
        screen:
            contains: "stream complete"
        timeoutMs: 15000
    - wait:
        screen:
            contains: "Ready"
        timeoutMs: 10000
    - snapshot: reply_done
    - type: "slow please"
    - press: enter
    - wait:
        screen:
            contains: "this takes a while"
        timeoutMs: 15000
    - press: esc
    - wait:
        screen:
            contains: "Cancelled"
        timeoutMs: 10000
    - snapshot: cancelled
    - press: enter
    - wait:
        screen:
            contains: "this takes a while"
        timeoutMs: 15000
    - press: ctrl+c
    # The first press cancels the reply as esc does: the prompt is back in
    # the composer, so the next press clears it and only the third quits.
    - wait:
        screen:
            contains: "Cancelled"
        timeoutMs: 10000
    - press: ctrl+c
    - wait:
        screen:
            contains: "Draft cleared"
        timeoutMs: 10000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 10000
outcomes:
    - id: tuimark_chat
      description: streaming, slash commands, esc cancel work end to end, and ctrl+c cancels a reply before it quits
      verify:
        process:
            exitCode: 0
contractHash: sha256:519c54db7b1512824923de5548da4283d5c8ec6904c34782fcf78e78ddc01a9b
