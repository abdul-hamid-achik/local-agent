version: 1
name: bun_tuimark_inline_edit_denied
intent: |
    the Tuimark inline client leaves the file untouched when the in-flow
    approval is denied, with n and with esc, the composer takes input again
    afterwards, and with an approval open ctrl+c denies it and cancels the turn,
    and a second press quits.
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "edit-deny-inline"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 40
    alternateScreen: forbid
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - type: "edit the notes"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - press: n
    - wait:
        screen:
            contains: "edit denied"
        timeoutMs: 15000
    - snapshot: denied_with_n
    - type: "edit it again"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - press: esc
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - type: "edit once more"
    - wait:
        screen:
            contains: "edit once more"
        timeoutMs: 10000
    - snapshot: denied_with_esc
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - snapshot: quit_with_approval_open
    - press: ctrl+c
    - wait:
        screen:
            contains: "ctrl+c again to quit"
        timeoutMs: 10000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 10000
outcomes:
    - id: tuimark_inline_edit_denied
      description: denying the in-flow proposal, with n and with esc, leaves the file unchanged
      verify:
        process:
            exitCode: 0
contractHash: sha256:6eca7ef785b5c72fde1bb9f0b8cbcc007b8072cb36c4de6ef7d52ca3d1e00c07
