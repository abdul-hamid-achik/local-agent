version: 1
name: bun_tuimark_edit_denied
intent: |
    the Tuimark client leaves the file untouched when the edit is denied, with
    n and with esc, gives the focus back to the composer afterwards, and quits with
    ctrl+c while the dialog is open.
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "edit-deny"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 32
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - type: "edit the notes"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - press: n
    - wait:
        screen:
            contains: "edit denied"
        timeoutMs: 15000
    - wait:
        screen:
            notContains: "Edit notes.txt?"
        timeoutMs: 10000
    - snapshot: denied_with_n
    - type: "edit it again"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - press: esc
    - wait:
        screen:
            notContains: "Edit notes.txt?"
        timeoutMs: 10000
    - wait:
        screen:
            contains: "Ready"
        timeoutMs: 15000
    - type: "edit once more"
    - wait:
        screen:
            contains: "edit once more"
        timeoutMs: 10000
    - snapshot: denied_with_esc
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - snapshot: quit_with_dialog_open
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 10000
outcomes:
    - id: tuimark_edit_denied
      description: denying the proposal, with n and with esc, leaves the file unchanged
      verify:
        process:
            exitCode: 0
contractHash: sha256:e4fbf0d2ec9cd9878ec08932a8213bb62bd4f2e675ec025dc3ecb8bd2cde416c
