version: 1
name: bun_tuimark_edit_denied
intent: |
    the Tuimark client leaves the file untouched when the edit is denied, with
    n and with esc, gives the focus back to the composer afterwards, and with the
    dialog open ctrl+c denies it and cancels the turn, and a second press quits.
target:
    cmd: ["bun", "specs/tuimark/fixture.ts", "edit-deny"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 32
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - type: "edit the notes"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - press: n
    - wait:
        screen:
            contains: "edit denied"
        timeoutMs: 15000
    - wait:
        screen:
            notContains: "Edit notes.txt?"
        timeoutMs: 10000
    - snapshot: denied_with_n
    - type: "edit it again"
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - press: esc
    - wait:
        screen:
            notContains: "Edit notes.txt?"
        timeoutMs: 10000
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 15000
    - type: "edit once more"
    - wait:
        screen:
            contains: "edit once more"
        timeoutMs: 10000
    - snapshot: denied_with_esc
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt?"
        timeoutMs: 15000
    - snapshot: quit_with_dialog_open
    - press: ctrl+c
    - wait:
        screen:
            contains: "ctrl+c again to quit"
        timeoutMs: 10000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 10000
outcomes:
    - id: tuimark_edit_denied
      description: denying the proposal, with n and with esc, leaves the file unchanged
      verify:
        process:
            exitCode: 0
contractHash: sha256:d6f1cd8a0c9e674d8de29cbd4658fb070cfbbf04f2842ee7ad0537e1498ad4a5
