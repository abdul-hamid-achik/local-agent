version: 1
name: bun_vue_tui_inline
intent: |
    the experimental Bun Vue TUI inline presentation accepts a prompt and
    commits the streamed assistant response to terminal scrollback.
target:
    cmd: ["bun", "specs/fixtures/bun_ollama.ts", "inline"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 28
    alternateScreen: forbid
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 10000
    - type: "hello"
    - wait:
        screen:
            contains: "hello"
        timeoutMs: 3000
    - press: enter
    - wait:
        screen:
            contains: "fixture reply to hello"
        timeoutMs: 10000
    - wait:
        screen:
            contains: "Enter send"
        timeoutMs: 3000
    - snapshot: inline_response
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: inline_commits_response
      description: inline mode shows the submitted prompt and fixture response
      verify:
        snapshot:
            name: inline_response
            mode: text
    - id: inline_uses_main_screen
      description: inline mode exits cleanly after the response is committed
      verify:
        process:
            exitCode: 0
contractHash: sha256:155f263d5a40aaa1f5a680dc37e0022aac90c95a627208d41ba0e1923e01a2db
