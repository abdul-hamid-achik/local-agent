version: 1
name: bun_vue_tui_verify
intent: |
    headless JSON mode reads an isolated workspace file, applies an approved
    exact edit, and runs an approved argv verification command against it.
target:
    cmd: ["bun", "specs/fixtures/bun_ollama.ts", "verify"]
    cwd: "${projectRoot}"
terminal:
    cols: 120
    rows: 36
    alternateScreen: forbid
steps:
    - wait:
        screen:
            contains: '"name":"read"'
        timeoutMs: 10000
    - wait:
        screen:
            contains: '"name":"run_command"'
        timeoutMs: 10000
    - wait:
        screen:
            contains: "verification passed"
        timeoutMs: 10000
    # The command's own exit code, inside the tool result's JSON output.
    - wait:
        screen:
            contains: '\"exitCode\":0'
        timeoutMs: 3000
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: headless_json_verifies_edit
      description: headless JSON reports a successful command with real output
      verify:
        screen:
            contains: "verification passed"
    - id: verification_reports_exit_code
      description: command tool output includes its actual process exit code
      verify:
        screen:
            contains: '\"exitCode\":0'
    - id: headless_json_exits_cleanly
      description: the isolated read-edit-verify flow exits successfully without alternate screen
      verify:
        process:
            exitCode: 0
contractHash: sha256:24d8da4bf75f48cbc99d67f399e6a1c7e754e990d8a2864d30ec43bdcbd0a657
