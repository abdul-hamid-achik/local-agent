version: 1
name: bun_vue_tui_edit_approved
intent: |
    the interactive agent applies an approved exact edit in an isolated
    temporary workspace.
target:
    cmd: ["bun", "specs/fixtures/bun_ollama.ts", "edit-approve"]
    cwd: "${projectRoot}"
terminal:
    cols: 100
    rows: 28
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Message the model"
        timeoutMs: 10000
    - type: "edit"
    # The composer's own row holds what was typed, before enter sends it.
    - wait:
        screen:
            matches: "│edit\\s*│"
        timeoutMs: 3000
    - press: enter
    - wait:
        screen:
            contains: "Edit notes.txt"
        timeoutMs: 10000
    - press: y
    - wait:
        screen:
            contains: "edit applied"
        timeoutMs: 10000
    - press: ctrl+c
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: edit_approved
      description: approving the proposal applies the exact edit in the workspace
      verify:
        process:
            exitCode: 0
contractHash: sha256:7f42e7602788823e8f20e0b1ee13f79945fee3c8b9954d8c4f6511901307d7a3
